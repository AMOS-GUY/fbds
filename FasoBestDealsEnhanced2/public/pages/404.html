<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page introuvable | FasoBestDeals</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="../css/design-system.css" />
  <style>
    body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: var(--space-8); text-align: center; }
    .error-num { font-family: var(--font-display); font-size: clamp(6rem, 15vw, 12rem); font-weight: 700; color: var(--surface-3); line-height: 1; margin-bottom: var(--space-4); }
    .error-icon { font-size: 3rem; margin-bottom: var(--space-6); }
    h1 { font-family: var(--font-display); font-size: var(--text-4xl); margin-bottom: var(--space-4); }
    p { color: var(--text-secondary); max-width: 440px; margin-bottom: var(--space-8); font-size: var(--text-lg); }
    .error-actions { display: flex; gap: var(--space-4); flex-wrap: wrap; justify-content: center; }
  </style>
</head>
<body>
<div>
  <div class="error-num">404</div>
  <div class="error-icon">🔍</div>
  <h1>Page introuvable</h1>
  <p>Oops ! La page que vous recherchez n'existe pas ou a été déplacée.</p>
  <div class="error-actions">
    <a href="home.html" class="btn btn-dark btn-lg"><i class="fas fa-home"></i> Retour à l'accueil</a>
    <a href="products.html" class="btn btn-outline btn-lg"><i class="fas fa-shopping-bag"></i> Voir les produits</a>
  </div>
</div>
<script src="../scripts/core.js"></script>
</body>
</html>
