<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:;"
    />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <title>Admin Login | Horizon</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .login-container {
        background: white;
        border-radius: 20px;
        padding: 40px;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }

      .login-header {
        text-align: center;
        margin-bottom: 30px;
      }

      .login-header i {
        font-size: 3rem;
        color: rgb(141, 210, 233);
        margin-bottom: 15px;
      }

      .login-header h1 {
        font-size: 1.8rem;
        color: #333;
      }

      .login-header p {
        color: #666;
        margin-top: 5px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 500;
        color: #555;
      }

      .form-group input {
        width: 100%;
        padding: 12px 15px;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        font-family: "Inter", sans-serif;
        font-size: 1rem;
      }

      .form-group input:focus {
        outline: none;
        border-color: rgb(141, 210, 233);
      }

      .login-btn {
        width: 100%;
        padding: 12px;
        background: linear-gradient(135deg, rgb(141, 210, 233), lightblue);
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
      }

      .login-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(141, 210, 233, 0.4);
      }

      .error-message {
        background: #ffebee;
        color: #c62828;
        padding: 10px;
        border-radius: 8px;
        margin-bottom: 20px;
        text-align: center;
        display: none;
      }

      .error-message.show {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="login-header">
        <i class="fas fa-leaf"></i>
        <h1>Admin Login</h1>
        <p>Enter your credentials to access the dashboard</p>
      </div>

      <div class="error-message" id="errorMessage">
        Invalid username or password
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" required autocomplete="off" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required />
        </div>
        <button type="submit" class="login-btn">Login</button>
      </form>
    </div>

    <script>
      // Change these credentials to something secure!
      const ADMIN_USERNAME = "admin";
      const ADMIN_PASSWORD = "Horizon2026!";

      document.getElementById("loginForm").addEventListener("submit", (e) => {
        e.preventDefault();

        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        const errorMsg = document.getElementById("errorMessage");

        if (username === ADMIN_USERNAME && password === ADMIN_PASSWORD) {
          // Set session
          sessionStorage.setItem("admin_logged_in", "true");
          sessionStorage.setItem("admin_login_time", Date.now());
          window.location.href = "index.html";
        } else {
          errorMsg.classList.add("show");
          setTimeout(() => {
            errorMsg.classList.remove("show");
          }, 3000);
        }
      });
    </script>
  </body>
</html>
