<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Blogs</title>
  </head>
  <body>
    <div class="add-elements">
      <div class="id-element">
        <input
          type="text"
          name=""
          id=""
          class="id-element-js"
          placeholder="id"
        />
      </div>
      <div class="title-element">
        <input
          type="text"
          name=""
          id=""
          placeholder="Title"
          class="title-element-js"
        />
      </div>
      <div class="except-element">
        <textarea
          name=""
          id=""
          placeholder="Excerpt"
          class="except-element-js"
        ></textarea>
      </div>
      <div class="date-element date-element-js"></div>
      <div class="category-element">
        <select name="" class="category-element-js">
          <option value="design">Design</option>
          <option value="marketing">Marketing</option>
          <option value="branding">Branding</option>
          <option value="ux">UX</option>
          <option value="strategy">Strategy</option>
          <option value="promotion">Promotion</option>
          <option value="featuring">Featuring</option>
        </select>
      </div>
      <div class="imagebg-element imagebg-element-js">
        <!-- <input type="text" name="imagebg" id="" class="imagebg-element-js" placeholder=""/> -->
      </div>
      <div class="full-content-element">
        <textarea
          name=""
          class="full-content-element-js"
          placeholder="Full-context"
        ></textarea>
      </div>
      <div class="picture-element">
        <input type="file" name="" class="picture-element-js" />
      </div>
      <button class="add-blog add-blog-js">Add Blog</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/dayjs/1.11.10/dayjs.min.js"></script>
    <script src="add-blogs.js" type="module"></script>
  </body>
</html>
