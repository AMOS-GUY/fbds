<!doctype html>
<html>
  <head>
    <title>Chatbot</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <div class="chat-container">
      <div class="chat-header">
        <h2>AI Chatbot Assistant</h2>
        <div class="status">Online</div>
      </div>

      <div class="chat-display chat-display-js">
        <div class="welcome-message">
          <div class="user-message bot-message">
            <img src="../media/robot.png" alt="Robot" class="sender-image" />
            <div class="message-bubble">
              Hello! I'm your AI assistant. How can I help you today?
            </div>
          </div>
        </div>
      </div>

      <div class="input-container">
        <input
          type="text"
          class="message-input message-input-js"
          placeholder="Type your message here..."
          autocomplete="off"
        />
        <button class="send-button send-button-js">Send</button>
      </div>
    </div>

    <script src="../scripts/main.js"></script>
  </body>
</html>
