<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="X-Frame-Options" content="DENY"/>
  <title>Mot de passe oublié | FasoBestDeals</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="../css/design-system.css"/>
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: var(--space-6); background: var(--surface-1); }
    .forgot-card { background: var(--surface-0); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: var(--space-10); width: 100%; max-width: 440px; }
    .forgot-icon { width: 64px; height: 64px; border-radius: var(--radius-full); background: var(--brand-gold-muted); display: flex; align-items: center; justify-content: center; font-size: var(--text-2xl); color: var(--brand-gold); margin: 0 auto var(--space-6); }
    h1 { font-family: var(--font-display); font-size: var(--text-3xl); font-weight: 600; text-align: center; margin-bottom: var(--space-3); }
    p { text-align: center; color: var(--text-secondary); font-size: var(--text-sm); margin-bottom: var(--space-7); }
  </style>
</head>
<body>
<div class="forgot-card">
  <div class="forgot-icon"><i class="fas fa-key"></i></div>
  <h1>Mot de passe oublié</h1>
  <p>Entrez votre adresse email. Si un compte est associé, nous vous enverrons un lien de réinitialisation.</p>
  <form id="forgotForm" novalidate>
    <div class="form-group" style="margin-bottom:var(--space-5);">
      <label class="form-label">Adresse email *</label>
      <input class="form-control" type="email" id="resetEmail" placeholder="vous@exemple.com" autocomplete="email" required/>
    </div>
    <button type="submit" class="btn btn-dark" style="width:100%;justify-content:center;padding:var(--space-4);margin-bottom:var(--space-5);" id="resetBtn">
      <i class="fas fa-paper-plane"></i> Envoyer le lien
    </button>
    <div style="text-align:center;font-size:var(--text-sm);">
      <a href="login.html" style="color:var(--brand-gold);font-weight:600;"><i class="fas fa-arrow-left"></i> Retour à la connexion</a>
    </div>
  </form>
</div>
<script src="../scripts/core.js"></script>
<script>
document.getElementById('forgotForm').addEventListener('submit', e => {
  e.preventDefault();
  const email = document.getElementById('resetEmail').value.trim();
  const btn = document.getElementById('resetBtn');
  if (!Security.validateEmail(email)) { Toast.show('Veuillez entrer un email valide.', 'error'); return; }
  if (Security.rateLimit('forgot_pw', 3, 300000)) { Toast.show('Trop de tentatives. Réessayez dans 5 minutes.', 'warning'); return; }
  btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Envoi…';
  setTimeout(() => {
    Toast.show('Si un compte existe, vous recevrez un email sous quelques minutes.');
    Security.logEvent('forgot_password', { email: Security.sanitize(email) });
    btn.disabled = false; btn.innerHTML = '<i class="fas fa-paper-plane"></i> Envoyer le lien';
  }, 1200);
});
</script>
</body>
</html>
